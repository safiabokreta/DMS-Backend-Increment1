spring.application.name=documents-service
server.port=8081

# PostgreSQL — values come from environment variables (Docker injects these)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dmsdb}
spring.datasource.username=${DB_USER:myuser}
spring.datasource.password=${DB_PASS:safiasafia}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

# S3 / MinIO
app.s3.endpoint=${S3_ENDPOINT:http://localhost:9000}
app.s3.region=${S3_REGION:us-east-1}
app.s3.access-key=${S3_ACCESS_KEY:admin}
app.s3.secret-key=${S3_SECRET_KEY:ensia123456}
app.s3.bucket=${S3_BUCKET:ensia}
app.s3.path-style-access=${S3_PATH_STYLE_ACCESS:true}
app.s3.presign-duration-seconds=300

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always