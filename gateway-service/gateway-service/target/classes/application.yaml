server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webmvc:
          routes:

            - id: documents
              uri: ${DOCUMENTS_SERVICE_URL:http://documents:8081}
              predicates:
                - Path=/api/documents/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}

            - id: comments
              uri: ${COMMENTS_SERVICE_URL:http://comments:8083}
              predicates:
                - Path=/api/comments/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}

            - id: esb
              uri: ${ESB_SERVICE_URL:http://esb:8084}
              predicates:
                - Path=/api/document/**
              filters:
                - RewritePath=/api/(?<segment>.*), /${segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always